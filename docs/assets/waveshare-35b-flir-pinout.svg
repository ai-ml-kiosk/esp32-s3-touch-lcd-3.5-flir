<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
  <title id="title">Waveshare ESP32-S3-Touch-LCD-3.5B FLIR connection pinout</title>
  <desc id="desc">Annotated 2x16 expansion header showing FLIR Lepton breakout connections on GPIO38, GPIO39, GPIO40, GPIO41, GPIO7, GPIO8, 3V3, and GND.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .board { fill: #9bbce0; stroke: #6b8fb6; stroke-width: 2; }
      .header { fill: #1f2937; }
      .hole { fill: #e5e7eb; stroke: #111827; stroke-width: 2; }
      .label { font: 700 19px Arial, sans-serif; fill: #fff; }
      .pinno { font: 700 15px Arial, sans-serif; fill: #111827; }
      .title { font: 700 38px Arial, sans-serif; fill: #334155; }
      .subtitle { font: 18px Arial, sans-serif; fill: #475569; }
      .small { font: 15px Arial, sans-serif; fill: #475569; }
      .callout { font: 700 18px Arial, sans-serif; fill: #111827; }
      .note { font: 16px Arial, sans-serif; fill: #334155; }
      .power { fill: #ef233c; }
      .ground { fill: #111111; }
      .gpio { fill: #74c043; }
      .uart { fill: #a276ff; }
      .i2c { fill: #35a8e0; }
      .key { fill: #c7d51c; }
      .usb { fill: #777; }
      .flir { fill: #ffcc33; stroke: #111827; stroke-width: 3; }
      .line { fill: none; stroke: #111827; stroke-width: 3; }
      .line-thin { fill: none; stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="820"/>
  <text class="title" x="560" y="56" text-anchor="middle">FLIR Lepton Wiring On Waveshare 3.5B Header</text>
  <text class="subtitle" x="560" y="90" text-anchor="middle">Use built-in LCD/touch as-is; connect only FLIR power, VoSPI, and CCI/I2C to the expansion header.</text>

  <rect class="board" x="326" y="126" width="468" height="520" rx="22"/>
  <text class="small" x="560" y="160" text-anchor="middle">ESP32-S3-Touch-LCD-3.5B back side, 2x16 expansion header</text>
  <rect class="header" x="470" y="184" width="180" height="398" rx="12"/>

  <!-- Header holes -->
  <g>
    <rect class="hole" x="494" y="204" width="34" height="24" rx="4"/><rect class="hole" x="592" y="204" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="228" width="34" height="24" rx="4"/><rect class="hole" x="592" y="228" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="252" width="34" height="24" rx="4"/><rect class="hole" x="592" y="252" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="276" width="34" height="24" rx="4"/><rect class="hole" x="592" y="276" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="300" width="34" height="24" rx="4"/><rect class="hole" x="592" y="300" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="324" width="34" height="24" rx="4"/><rect class="hole" x="592" y="324" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="348" width="34" height="24" rx="4"/><rect class="hole" x="592" y="348" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="372" width="34" height="24" rx="4"/><rect class="hole" x="592" y="372" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="396" width="34" height="24" rx="4"/><rect class="hole" x="592" y="396" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="420" width="34" height="24" rx="4"/><rect class="hole" x="592" y="420" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="444" width="34" height="24" rx="4"/><rect class="hole" x="592" y="444" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="468" width="34" height="24" rx="4"/><rect class="hole" x="592" y="468" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="492" width="34" height="24" rx="4"/><rect class="hole" x="592" y="492" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="516" width="34" height="24" rx="4"/><rect class="hole" x="592" y="516" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="540" width="34" height="24" rx="4"/><rect class="hole" x="592" y="540" width="34" height="24" rx="4"/>
    <rect class="hole" x="494" y="564" width="34" height="24" rx="4"/><rect class="hole" x="592" y="564" width="34" height="24" rx="4"/>
  </g>

  <!-- Pin numbers -->
  <g>
    <text class="pinno" x="454" y="222">1</text><text class="pinno" x="660" y="222">2</text>
    <text class="pinno" x="454" y="246">3</text><text class="pinno" x="660" y="246">4</text>
    <text class="pinno" x="454" y="270">5</text><text class="pinno" x="660" y="270">6</text>
    <text class="pinno" x="454" y="294">7</text><text class="pinno" x="660" y="294">8</text>
    <text class="pinno" x="454" y="318">9</text><text class="pinno" x="660" y="318">10</text>
    <text class="pinno" x="448" y="342">11</text><text class="pinno" x="660" y="342">12</text>
    <text class="pinno" x="448" y="366">13</text><text class="pinno" x="660" y="366">14</text>
    <text class="pinno" x="448" y="390">15</text><text class="pinno" x="660" y="390">16</text>
    <text class="pinno" x="448" y="414">17</text><text class="pinno" x="660" y="414">18</text>
    <text class="pinno" x="448" y="438">19</text><text class="pinno" x="660" y="438">20</text>
    <text class="pinno" x="448" y="462">21</text><text class="pinno" x="660" y="462">22</text>
    <text class="pinno" x="448" y="486">23</text><text class="pinno" x="660" y="486">24</text>
    <text class="pinno" x="448" y="510">25</text><text class="pinno" x="660" y="510">26</text>
    <text class="pinno" x="448" y="534">27</text><text class="pinno" x="660" y="534">28</text>
    <text class="pinno" x="448" y="558">29</text><text class="pinno" x="660" y="558">30</text>
    <text class="pinno" x="448" y="582">31</text><text class="pinno" x="660" y="582">32</text>
  </g>

  <!-- Left labels -->
  <g>
    <rect class="power" x="130" y="204" width="290" height="22" rx="4"/><text class="label" x="395" y="221" text-anchor="end">BAT</text>
    <rect class="ground" x="130" y="228" width="290" height="22" rx="4"/><text class="label" x="395" y="245" text-anchor="end">GND</text>
    <rect class="gpio" x="130" y="252" width="290" height="22" rx="4"/><text class="label" x="395" y="269" text-anchor="end">GPIO21</text>
    <rect class="flir" x="130" y="276" width="290" height="22" rx="4"/><text class="callout" x="395" y="293" text-anchor="end">GPIO38 - FLIR CLK</text>
    <rect class="flir" x="130" y="300" width="290" height="22" rx="4"/><text class="callout" x="395" y="317" text-anchor="end">GPIO39 - FLIR MISO</text>
    <rect class="flir" x="130" y="324" width="290" height="22" rx="4"/><text class="callout" x="395" y="341" text-anchor="end">GPIO40 - FLIR MOSI</text>
    <rect class="flir" x="130" y="348" width="290" height="22" rx="4"/><text class="callout" x="395" y="365" text-anchor="end">GPIO41 - FLIR CS</text>
    <rect class="gpio" x="130" y="372" width="290" height="22" rx="4"/><text class="label" x="395" y="389" text-anchor="end">GPIO42</text>
    <rect class="gpio" x="130" y="396" width="290" height="22" rx="4"/><text class="label" x="395" y="413" text-anchor="end">GPIO45</text>
    <rect class="gpio" x="130" y="420" width="290" height="22" rx="4"/><text class="label" x="395" y="437" text-anchor="end">GPIO46</text>
    <rect class="gpio" x="130" y="444" width="290" height="22" rx="4"/><text class="label" x="395" y="461" text-anchor="end">GPIO47</text>
    <rect class="gpio" x="130" y="468" width="290" height="22" rx="4"/><text class="label" x="395" y="485" text-anchor="end">GPIO48</text>
    <rect class="uart" x="130" y="492" width="290" height="22" rx="4"/><text class="label" x="395" y="509" text-anchor="end">RXD(GPIO43)</text>
    <rect class="uart" x="130" y="516" width="290" height="22" rx="4"/><text class="label" x="395" y="533" text-anchor="end">TXD(GPIO44)</text>
    <rect class="ground" x="130" y="540" width="290" height="22" rx="4"/><text class="label" x="395" y="557" text-anchor="end">GND - FLIR GND</text>
    <rect class="power" x="130" y="564" width="290" height="22" rx="4"/><text class="label" x="395" y="581" text-anchor="end">3V3 - FLIR VIN</text>
  </g>

  <!-- Right labels -->
  <g>
    <rect class="power" x="700" y="204" width="290" height="22" rx="4"/><text class="label" x="725" y="221">5V</text>
    <rect class="ground" x="700" y="228" width="290" height="22" rx="4"/><text class="label" x="725" y="245">GND</text>
    <rect class="usb" x="700" y="252" width="290" height="22" rx="4"/><text class="label" x="725" y="269">DN(GPIO19)</text>
    <rect class="usb" x="700" y="276" width="290" height="22" rx="4"/><text class="label" x="725" y="293">DP(GPIO20)</text>
    <rect class="gpio" x="700" y="300" width="290" height="22" rx="4"/><text class="label" x="725" y="317">GPIO11</text>
    <rect class="gpio" x="700" y="324" width="290" height="22" rx="4"/><text class="label" x="725" y="341">GPIO10</text>
    <rect class="gpio" x="700" y="348" width="290" height="22" rx="4"/><text class="label" x="725" y="365">GPIO9</text>
    <rect class="gpio" x="700" y="372" width="290" height="22" rx="4"/><text class="label" x="725" y="389">GPIO17</text>
    <rect class="gpio" x="700" y="396" width="290" height="22" rx="4"/><text class="label" x="725" y="413">GPIO18</text>
    <rect class="key" x="700" y="420" width="290" height="22" rx="4"/><text class="label" x="725" y="437">BOOT(GPIO0)</text>
    <rect class="key" x="700" y="444" width="290" height="22" rx="4"/><text class="label" x="725" y="461">RST</text>
    <rect class="key" x="700" y="468" width="290" height="22" rx="4"/><text class="label" x="725" y="485">PWR</text>
    <rect class="flir" x="700" y="492" width="290" height="22" rx="4"/><text class="callout" x="725" y="509">SCL(GPIO7) - FLIR SCL</text>
    <rect class="flir" x="700" y="516" width="290" height="22" rx="4"/><text class="callout" x="725" y="533">SDA(GPIO8) - FLIR SDA</text>
    <rect class="ground" x="700" y="540" width="290" height="22" rx="4"/><text class="label" x="725" y="557">GND - FLIR GND</text>
    <rect class="power" x="700" y="564" width="290" height="22" rx="4"/><text class="label" x="725" y="581">3V3 - FLIR VIN</text>
  </g>

  <rect x="76" y="660" width="968" height="104" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <text class="note" x="104" y="694">Recommended FLIR Lepton 2.5 breakout v1.4 connections:</text>
  <text class="note" x="104" y="724">VoSPI: CLK GPIO38, MISO GPIO39, MOSI GPIO40, CS GPIO41. CCI/I2C: SCL GPIO7, SDA GPIO8.</text>
  <text class="note" x="104" y="754">Power: connect breakout VIN/VCC to 3V3 and GND to GND. Breakout v1.4 PWR_EN and RST are not connected.</text>
</svg>
