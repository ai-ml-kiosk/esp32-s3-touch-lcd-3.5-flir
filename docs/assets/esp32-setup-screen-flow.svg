<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 on-device setup screen flow</title>
  <desc id="desc">Diagram showing the ESP32 FLIR viewer setup gear opening the on-device setup overlay with path, idle sleep, calibration, auto-rotation, manual orientation, show filename toggle, raw capture toggle, save, and cancel. Capture later writes to the configured TF-card path.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .device { fill: #111827; }
      .screen { fill: #0f172a; }
      .panel { fill: #172033; stroke: #334155; stroke-width: 2; }
      .thermal { fill: #1e3a8a; stroke: #475569; stroke-width: 2; }
      .setup { fill: #ffffff; stroke: #0ea5e9; stroke-width: 3; }
      .field { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .button { fill: #27364f; stroke: #64748b; stroke-width: 2; }
      .primary { fill: #0ea5e9; stroke: #0369a1; stroke-width: 2; }
      .toggleOn { fill: #22c55e; stroke: #166534; stroke-width: 2; }
      .toggleOff { fill: #64748b; stroke: #334155; stroke-width: 2; }
      .knob { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .title { font: 700 32px Arial, sans-serif; fill: #334155; }
      .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .text { font: 15px Arial, sans-serif; fill: #334155; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .white { font: 700 15px Arial, sans-serif; fill: #f8fafc; }
      .muted { font: 14px Arial, sans-serif; fill: #64748b; }
      .line { fill: none; stroke: #f97316; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .lineBlue { fill: none; stroke: #0ea5e9; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f97316"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <rect class="bg" width="1080" height="720"/>
  <text class="title" x="540" y="46" text-anchor="middle">ESP32 Setup Overlay Flow</text>
  <text class="muted" x="540" y="72" text-anchor="middle">On-device C++ UI, no host Python or desktop dialog</text>

  <rect class="device" x="64" y="118" width="470" height="320" rx="24"/>
  <rect class="screen" x="90" y="148" width="418" height="260" rx="4"/>
  <rect class="panel" x="90" y="148" width="418" height="34"/>
  <rect x="104" y="158" width="28" height="16" rx="3" fill="none" stroke="#f8fafc" stroke-width="2"/>
  <rect x="109" y="162" width="18" height="8" fill="#475569"/>
  <rect x="129" y="164" width="1" height="4" fill="#f8fafc"/>
  <rect class="button" x="146" y="154" width="66" height="22" rx="5"/>
  <text class="white" x="238" y="170">LIVE</text>
  <circle cx="280" cy="165" r="5" fill="#22c55e"/>
  <text class="white" x="490" y="170" text-anchor="end">TF OK</text>

  <rect class="thermal" x="106" y="198" width="334" height="146"/>
  <text class="white" x="273" y="276" text-anchor="middle">Thermal Viewer</text>
  <rect class="button" x="106" y="366" width="52" height="28" rx="5"/>
  <rect x="120" y="374" width="7" height="4" fill="#ef4444"/>
  <rect x="129" y="374" width="7" height="4" fill="#facc15"/>
  <rect x="120" y="380" width="7" height="4" fill="#22c55e"/>
  <rect x="129" y="380" width="7" height="4" fill="#3b82f6"/>
  <rect x="118" y="372" width="20" height="14" fill="none" stroke="#e5e7eb" stroke-width="1"/>
  <rect class="button" x="170" y="366" width="52" height="28" rx="5"/>
  <rect x="184" y="373" width="24" height="15" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="187" y="376" width="18" height="2.5" fill="#e5e7eb"/>
  <rect x="187" y="381" width="18" height="2.5" fill="#64748b"/>
  <rect class="button" x="234" y="366" width="52" height="28" rx="5"/>
  <rect x="247" y="375" width="26" height="12" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="252" y="371" width="9" height="4" fill="#e5e7eb"/>
  <rect x="256" y="378" width="8" height="8" fill="none" stroke="#e5e7eb" stroke-width="1.2"/>
  <rect class="button" x="298" y="366" width="52" height="28" rx="5"/>
  <rect x="312" y="373" width="24" height="15" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <polygon points="317,376 317,384 324,380" fill="#e5e7eb"/>
  <rect x="332" y="376" width="8" height="10" fill="none" stroke="#e5e7eb" stroke-width="1.2"/>
  <rect class="primary" x="362" y="366" width="52" height="28" rx="5"/>
  <rect x="382" y="375" width="12" height="8" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="386" y="370" width="4" height="5" fill="#e5e7eb"/>
  <rect x="386" y="388" width="4" height="5" fill="#e5e7eb"/>
  <rect x="376" y="377" width="6" height="4" fill="#e5e7eb"/>
  <rect x="394" y="377" width="6" height="4" fill="#e5e7eb"/>

  <path class="line" d="M414 380 C552 380 540 126 626 126"/>

  <rect class="setup" x="626" y="96" width="386" height="392" rx="14"/>
  <text class="label" x="650" y="130">On-device Setup Overlay</text>
  <text class="muted" x="650" y="154">Thermal controls paused; Save/Cancel stay fixed</text>

  <text class="text" x="650" y="198">Path</text>
  <rect class="field" x="706" y="178" width="126" height="30" rx="5"/>
  <text class="small" x="720" y="198">/flir</text>
  <text class="text" x="850" y="198">Auto</text>
  <rect class="toggleOn" x="906" y="178" width="70" height="30" rx="15"/>
  <circle class="knob" cx="960" cy="193" r="11"/>
  <text class="white" x="922" y="198">ON</text>

  <text class="text" x="650" y="244">Idle</text>
  <rect class="field" x="706" y="224" width="126" height="30" rx="5"/>
  <text class="small" x="720" y="244">Off</text>
  <text class="text" x="850" y="244">Orient</text>
  <rect class="field" x="906" y="224" width="70" height="30" rx="5"/>
  <text class="small" x="922" y="244">Auto</text>

  <text class="text" x="650" y="290">Cal</text>
  <rect class="field" x="706" y="270" width="126" height="30" rx="5"/>
  <text class="small" x="720" y="290">+0.0C</text>
  <text class="text" x="850" y="290">Show Name</text>
  <rect class="toggleOn" x="936" y="270" width="40" height="30" rx="15"/>
  <circle class="knob" cx="962" cy="285" r="10"/>

  <text class="text" x="850" y="336">Raw</text>
  <rect class="toggleOn" x="906" y="316" width="70" height="30" rx="15"/>
  <circle class="knob" cx="960" cy="331" r="11"/>
  <text class="white" x="922" y="336">ON</text>

  <rect class="field" x="650" y="382" width="118" height="32" rx="6"/>
  <text class="text" x="709" y="403" text-anchor="middle">Cancel</text>
  <rect class="primary" x="858" y="382" width="118" height="32" rx="6"/>
  <text class="white" x="917" y="403" text-anchor="middle">Save</text>

  <text class="muted" x="650" y="442">
    <tspan x="650" dy="0">Save validates path, persists NVS settings,</tspan>
    <tspan x="650" dy="20">and reapplies display/touch orientation.</tspan>
  </text>

  <path class="lineBlue" d="M906 398 C760 566 432 532 260 394"/>
  <text class="label" x="120" y="524">Capture contract</text>
  <text class="text" x="120" y="552">
    <tspan x="120" dy="0">CAP reads Settings.savePath at press time.</tspan>
    <tspan x="120" dy="22">BMP is always saved under the TF-card path.</tspan>
    <tspan x="120" dy="22">Raw switch ON writes matching .raw; OFF saves BMP only.</tspan>
  </text>

  <text class="label" x="626" y="548">Toggle meaning</text>
  <rect class="toggleOn" x="626" y="568" width="72" height="30" rx="15"/>
  <circle class="knob" cx="681" cy="583" r="11"/>
  <text class="white" x="642" y="588">ON</text>
  <text class="text" x="714" y="589">enabled</text>
  <rect class="toggleOff" x="626" y="616" width="72" height="30" rx="15"/>
  <circle class="knob" cx="643" cy="631" r="11"/>
  <text class="white" x="662" y="636">OFF</text>
  <text class="text" x="714" y="637">disabled</text>

  <text class="label" x="626" y="676">Portrait setup</text>
  <text class="text" x="764" y="676">
    <tspan x="764" dy="0">same fields in one scrollable column;</tspan>
    <tspan x="764" dy="22">Cancel and Save remain fixed.</tspan>
  </text>
</svg>
