  <rect x="434" y="472" width="26" height="12" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="439" y="468" width="9" height="4" fill="#e5e7eb"/>
  <rect x="443" y="475" width="8" height="8" fill="none" stroke="#e5e7eb" stroke-width="1.2"/>
  <rect class="button" x="476" y="464" width="42" height="26" rx="5"/>
  <rect x="485" y="470" width="24" height="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <polygon points="490,473 490,481 497,477" fill="#e5e7eb"/>
  <rect x="505" y="473" width="8" height="10" fill="none" stroke="#e5e7eb" stroke-width="1.2"/>
  <rect class="button" x="526" y="464" width="42" height="26" rx="5"/>
  <rect x="541" y="472" width="12" height="8" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="545" y="467" width="4" height="5" fill="#e5e7eb"/>
  <rect x="545" y="480" width="4" height="5" fill="#e5e7eb"/>
  <rect class="button" x="576" y="464" width="42" height="26" rx="5"/>
  <rect x="594" y="473" width="8" height="8" fill="none" stroke="#e5e7eb" stroke-width="1.4"/>
  <rect x="596" y="466" width="4" height="5" fill="#e5e7eb"/>
  <rect x="596" y="482" width="4" height="5" fill="#e5e7eb"/>
  <rect x="587" y="476" width="5" height="3" fill="#e5e7eb"/>
  <rect x="604" y="476" width="5" height="3" fill="#e5e7eb"/>
  <rect class="button" x="700" y="464" width="42" height="26" rx="5"/>
  <rect x="713" y="473" width="16" height="12" fill="none" stroke="#f87171" stroke-width="1.7"/>
  <rect x="711" y="477" width="3" height="6" fill="#f87171"/>
  <rect x="728" y="477" width="3" height="6" fill="#f87171"/>
  <rect x="720" y="466" width="3" height="11" fill="#f87171"/>

  <path class="line" d="M584 202 H890"/>
  <text class="calloutTitle" x="905" y="196">Status bar</text>
  <text class="callout" x="905" y="221">
    <tspan x="905" dy="0">orientation indicator, Z1X/Z2X,</tspan>
    <tspan x="905" dy="20">overlay, center overlay, marker</tspan>
    <tspan x="905" dy="20">clear, live state, TF/free space</tspan>
  </text>

  <path class="line" d="M666 320 H890"/>
  <text class="calloutTitle" x="905" y="324">Thermal viewport</text>
  <text class="callout" x="905" y="349">
    <tspan x="905" dy="0">80x60 Lepton source</tspan>
    <tspan x="905" dy="20">scaled inside viewer area</tspan>
  </text>

  <path class="line" d="M684 332 L760 332 L760 388 H890"/>
  <text class="calloutTitle" x="905" y="388">Palette scale</text>
  <text class="callout" x="905" y="413">
    <tspan x="905" dy="0">current auto low/high</tspan>
    <tspan x="905" dy="20">temperature range</tspan>
  </text>

  <path class="line" d="M725 398 L820 398 L820 448 H890"/>
  <text class="calloutTitle" x="905" y="448">Readouts</text>
  <text class="callout" x="905" y="473">
    <tspan x="905" dy="0">center temperature,</tspan>
    <tspan x="905" dy="20">range mode, RGB666 palette</tspan>
  </text>

  <path class="line-left" d="M334 392 H118"/>
  <text class="calloutTitle" x="38" y="376">Spot markers</text>
  <text class="callout" x="38" y="401">
    <tspan x="38" dy="0">square hot/cold</tspan>
    <tspan x="38" dy="20">and up to three</tspan>
    <tspan x="38" dy="20">custom spot markers</tspan>
  </text>

  <path class="line-left" d="M347 490 V542 H240"/>
  <text class="calloutTitle" x="58" y="524">Palette icon</text>
  <text class="callout" x="58" y="549">
    <tspan x="58" dy="0">Cycles Ironbow, White,</tspan>
    <tspan x="58" dy="20">Black, Histogram, Lava,</tspan>
    <tspan x="58" dy="20">Hot Iron, Medical, Arctic,</tspan>
    <tspan x="58" dy="20">Rainbow, and Red Hot</tspan>
  </text>

  <path class="line-left" d="M397 490 V648 H240"/>
  <text class="calloutTitle" x="58" y="630">Image quality icon</text>
  <text class="callout" x="58" y="655">
    <tspan x="58" dy="0">Cycles Detail,</tspan>
    <tspan x="58" dy="20">Balanced, and Smooth</tspan>
    <tspan x="58" dy="20">noise handling</tspan>
  </text>

  <path class="line" d="M447 490 V530 H890"/>
  <text class="calloutTitle" x="905" y="512">CAP button</text>
  <text class="callout" x="905" y="537">
    <tspan x="905" dy="0">saves timestamped BMP</tspan>
    <tspan x="905" dy="20">and optional raw frame</tspan>
  </text>

  <path class="line" d="M547 490 V600 H890"/>
  <text class="calloutTitle" x="905" y="582">Review/Delete button</text>
  <text class="callout" x="905" y="607">
    <tspan x="905" dy="0">opens latest capture</tspan>
    <tspan x="905" dy="20">review and delete action</tspan>
  </text>

  <path class="line" d="M597 490 V658 H890"/>
  <text class="calloutTitle" x="905" y="640">SETUP button</text>
  <text class="callout" x="905" y="665">
    <tspan x="905" dy="0">opens settings for path,</tspan>
    <tspan x="905" dy="20">idle, rotation, raw save</tspan>
  </text>

  <path class="line" d="M721 490 V730 H890"/>
  <text class="calloutTitle" x="905" y="714">Power icon</text>
  <text class="callout" x="905" y="739">
    <tspan x="905" dy="0">red PMIC shutdown;</tspan>
    <tspan x="905" dy="20">wake with physical PWR</tspan>
  </text>

  <path class="line-left" d="M312 191 V138 H118"/>
  <text class="calloutTitle" x="38" y="112">Status Icons</text>
  <text class="callout" x="38" y="137">
    <tspan x="38" dy="0">QMI8658</tspan>
    <tspan x="38" dy="20">auto-rotation;</tspan>
    <tspan x="38" dy="20">Z1X/Z2X, hi/low,</tspan>
    <tspan x="38" dy="20">center toggles</tspan>
  </text>

  <path class="line-left" d="M246 290 H118"/>
  <text class="calloutTitle" x="38" y="274">Overlay</text>
  <text class="callout" x="38" y="299">
    <tspan x="38" dy="0">center plus</tspan>
    <tspan x="38" dy="20">marker toggled</tspan>
    <tspan x="38" dy="20">separately</tspan>
  </text>
</svg>
