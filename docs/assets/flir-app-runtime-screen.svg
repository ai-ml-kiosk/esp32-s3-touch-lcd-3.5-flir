  <rect x="379" y="194" width="16" height="16" fill="none" stroke="#e5e7eb" stroke-width="1.2"/>
  <rect x="374" y="202" width="7" height="2" fill="#e5e7eb"/>
  <rect x="393" y="202" width="7" height="2" fill="#e5e7eb"/>
  <rect x="386" y="189" width="2" height="7" fill="#e5e7eb"/>
  <rect x="386" y="208" width="2" height="7" fill="#e5e7eb"/>
  <rect x="410" y="194" width="16" height="16" fill="none" stroke="#f472b6" stroke-width="1.2"/>
  <rect x="406" y="202" width="8" height="2" fill="#f472b6"/>
  <rect x="422" y="202" width="8" height="2" fill="#f472b6"/>
  <rect x="417" y="190" width="2" height="8" fill="#f472b6"/>
  <rect x="417" y="206" width="2" height="8" fill="#f472b6"/>
  <rect x="422" y="192" width="3" height="3" fill="#f472b6"/>
  <rect x="414" y="200" width="3" height="3" fill="#f472b6"/>
  <rect x="406" y="208" width="3" height="3" fill="#f472b6"/>
  <text class="label" x="444" y="207">LIVE</text>
  <circle cx="486" cy="202" r="5" fill="#22c55e"/>
  <text class="small" x="512" y="207">8.6 fps</text>
  <text class="small" x="716" y="201" text-anchor="end">TF OK</text>
  <text class="tiny" x="716" y="215" text-anchor="end">FREE 14.8G</text>

  <rect x="246" y="228" width="420" height="208" fill="url(#thermal)"/>
  <rect x="246" y="228" width="420" height="208" fill="url(#hotBlob)" opacity="0.82"/>
  <rect x="246" y="228" width="420" height="208" fill="url(#warmBlob)" opacity="0.55"/>
  <path d="M246 284 C318 254 360 292 413 264 C488 226 558 258 666 240" fill="none" stroke="#fef3c7" stroke-width="2" opacity="0.45"/>
  <path d="M246 378 C314 344 380 398 443 366 C516 332 590 374 666 338" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
  <rect class="hot" x="514" y="288" width="28" height="28"/>
  <text class="label" x="552" y="295">
    <tspan x="552" dy="0">HOT</tspan>
    <tspan x="552" dy="18">36.8 C</tspan>
  </text>
  <rect class="cold" x="322" y="380" width="24" height="24"/>
  <text class="label" x="354" y="385">
    <tspan x="354" dy="0">COLD</tspan>
    <tspan x="354" dy="18">23.4 C</tspan>
  </text>
  <line x1="438" y1="332" x2="474" y2="332" stroke="#f8fafc" stroke-width="3"/>
  <line x1="456" y1="314" x2="456" y2="350" stroke="#f8fafc" stroke-width="3"/>
  <text class="label" x="478" y="329">CTR 29.7 C</text>
  <rect x="438" y="258" width="20" height="20" fill="none" stroke="#f472b6" stroke-width="3"/>
  <line x1="431" y1="268" x2="465" y2="268" stroke="#f472b6" stroke-width="3"/>
  <line x1="448" y1="251" x2="448" y2="285" stroke="#f472b6" stroke-width="3"/>
  <text class="label" x="466" y="260">M1 31.4 C</text>

  <rect x="676" y="228" width="16" height="208" fill="url(#palette)"/>
  <text class="tiny" x="684" y="223" text-anchor="middle">38 C</text>
  <text class="tiny" x="684" y="454" text-anchor="middle">22 C</text>

  <rect class="panel" x="704" y="228" width="42" height="208"/>
  <text class="tiny" x="711" y="250">
    <tspan x="711" dy="0">CTR</tspan>
    <tspan class="label" x="711" dy="20">29.7</tspan>
  </text>
  <text class="tiny" x="711" y="320">
    <tspan x="711" dy="0">RNG</tspan>
    <tspan class="label" x="711" dy="20">AUTO</tspan>
  </text>
  <text class="tiny" x="711" y="390">
    <tspan x="711" dy="0">PAL</tspan>
    <tspan class="label" x="711" dy="20">IRON</tspan>
  </text>

  <rect class="button" x="326" y="464" width="42" height="26" rx="5"/>
  <rect x="340" y="471" width="7" height="4" fill="#ef4444"/>
  <rect x="350" y="471" width="7" height="4" fill="#facc15"/>
  <rect x="340" y="477" width="7" height="4" fill="#22c55e"/>
  <rect x="350" y="477" width="7" height="4" fill="#3b82f6"/>
  <rect x="338" y="469" width="22" height="14" fill="none" stroke="#e5e7eb" stroke-width="1"/>
  <rect class="button" x="376" y="464" width="42" height="26" rx="5"/>
