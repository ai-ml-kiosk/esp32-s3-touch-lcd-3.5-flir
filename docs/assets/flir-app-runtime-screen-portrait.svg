  <rect x="451" y="174" width="7" height="2" fill="#e5e7eb"/>
  <rect x="470" y="174" width="7" height="2" fill="#e5e7eb"/>
  <rect x="463" y="161" width="2" height="7" fill="#e5e7eb"/>
  <rect x="463" y="180" width="2" height="7" fill="#e5e7eb"/>
  <rect x="482" y="166" width="16" height="16" fill="none" stroke="#f472b6" stroke-width="1.2"/>
  <rect x="478" y="174" width="8" height="2" fill="#f472b6"/>
  <rect x="494" y="174" width="8" height="2" fill="#f472b6"/>
  <rect x="489" y="162" width="2" height="8" fill="#f472b6"/>
  <rect x="489" y="178" width="2" height="8" fill="#f472b6"/>
  <rect x="494" y="164" width="3" height="3" fill="#f472b6"/>
  <rect x="486" y="172" width="3" height="3" fill="#f472b6"/>
  <rect x="478" y="180" width="3" height="3" fill="#f472b6"/>
  <text class="label" x="514" y="179">LIVE</text>
  <circle cx="556" cy="174" r="5" fill="#22c55e"/>
  <text class="tiny" x="548" y="170" text-anchor="end">TF OK</text>
  <text class="tiny" x="548" y="184" text-anchor="end">FREE 14.8G</text>
  <rect x="562" y="166" width="30" height="16" fill="none" stroke="#e5e7eb" stroke-width="1.3"/>
  <rect x="592" y="171" width="3" height="6" fill="#e5e7eb"/>
  <rect x="564" y="168" width="22" height="12" fill="#22c55e"/>
  <text class="tiny" x="577" y="179" text-anchor="middle" fill="#0f172a">84</text>
  <rect x="597" y="166" width="2" height="8" fill="#22c55e"/>
  <rect x="595" y="172" width="5" height="2" fill="#22c55e"/>

  <rect x="344" y="208" width="224" height="334" fill="url(#thermal)"/>
  <rect x="344" y="208" width="224" height="334" fill="url(#hotBlob)" opacity="0.82"/>
  <rect x="344" y="208" width="224" height="334" fill="url(#warmBlob)" opacity="0.55"/>
  <path d="M344 288 C388 254 414 292 446 262 C490 222 528 258 568 236" fill="none" stroke="#fef3c7" stroke-width="2" opacity="0.45"/>
  <path d="M344 424 C386 386 424 444 460 410 C502 370 532 408 568 374" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
  <rect class="hot" x="472" y="290" width="28" height="28"/>
  <text class="label" x="508" y="300">
    <tspan x="508" dy="0">HOT</tspan>
    <tspan x="508" dy="18">36.8 C</tspan>
  </text>
  <rect class="cold" x="384" y="474" width="24" height="24"/>
  <text class="label" x="418" y="482">
    <tspan x="418" dy="0">COLD</tspan>
    <tspan x="418" dy="18">23.4 C</tspan>
  </text>
  <line x1="438" y1="375" x2="474" y2="375" stroke="#f8fafc" stroke-width="3"/>
  <line x1="456" y1="357" x2="456" y2="393" stroke="#f8fafc" stroke-width="3"/>
  <text class="label" x="380" y="368">CTR 29.7 C</text>
  <rect x="444" y="250" width="20" height="20" fill="none" stroke="#f472b6" stroke-width="3"/>
  <line x1="437" y1="260" x2="471" y2="260" stroke="#f472b6" stroke-width="3"/>
  <line x1="454" y1="243" x2="454" y2="277" stroke="#f472b6" stroke-width="3"/>
  <text class="label" x="474" y="252">M1 31.4 C</text>

  <rect x="586" y="208" width="16" height="334" fill="url(#palette)"/>
  <text class="tiny" x="594" y="203" text-anchor="middle">38 C</text>
  <text class="tiny" x="594" y="554" text-anchor="middle">22 C</text>

  <rect class="panel" x="344" y="556" width="258" height="48"/>
  <text class="tiny" x="362" y="576">CTR</text>
  <text class="label" x="362" y="596">29.7</text>
  <text class="tiny" x="446" y="576">RNG</text>
  <text class="label" x="446" y="596">AUTO</text>
  <text class="tiny" x="540" y="576">PAL</text>
  <text class="label" x="540" y="596">IRON</text>

  <rect class="button" x="344" y="624" width="30" height="24" rx="5"/>
  <rect x="353" y="631" width="6" height="4" fill="#ef4444"/>
  <rect x="361" y="631" width="6" height="4" fill="#facc15"/>
  <rect x="353" y="637" width="6" height="4" fill="#22c55e"/>
  <rect x="361" y="637" width="6" height="4" fill="#3b82f6"/>
  <rect class="button" x="382" y="624" width="30" height="24" rx="5"/>
  <rect x="387" y="630" width="20" height="14" fill="none" stroke="#e5e7eb" stroke-width="1.4"/>
