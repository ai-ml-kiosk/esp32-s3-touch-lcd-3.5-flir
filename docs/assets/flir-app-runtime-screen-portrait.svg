  <rect x="463" y="630" width="20" height="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <polygon points="468,633 468,641 475,637" fill="#e5e7eb"/>
  <rect x="479" y="633" width="7" height="10" fill="none" stroke="#e5e7eb" stroke-width="1.2"/>
  <rect class="button" x="496" y="624" width="30" height="24" rx="5"/>
  <rect x="505" y="632" width="12" height="8" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="509" y="627" width="4" height="5" fill="#e5e7eb"/>
  <rect x="509" y="640" width="4" height="5" fill="#e5e7eb"/>
  <rect class="button" x="534" y="624" width="30" height="24" rx="5"/>
  <rect x="544" y="633" width="10" height="8" fill="none" stroke="#e5e7eb" stroke-width="1.4"/>
  <rect x="547" y="628" width="4" height="5" fill="#e5e7eb"/>
  <rect x="547" y="641" width="4" height="5" fill="#e5e7eb"/>
  <rect x="539" y="636" width="5" height="3" fill="#e5e7eb"/>
  <rect x="554" y="636" width="5" height="3" fill="#e5e7eb"/>
  <rect class="button" x="572" y="624" width="30" height="24" rx="5"/>
  <rect x="579" y="633" width="15" height="12" fill="none" stroke="#f87171" stroke-width="1.7"/>
  <rect x="577" y="637" width="3" height="6" fill="#f87171"/>
  <rect x="593" y="637" width="3" height="6" fill="#f87171"/>
  <rect x="585" y="627" width="3" height="11" fill="#f87171"/>

  <path class="line" d="M552 174 H742"/>
  <text class="calloutTitle" x="758" y="168">Status bar</text>
  <text class="callout" x="758" y="193">
    <tspan x="758" dy="0">orientation, FULL/2X,</tspan>
    <tspan x="758" dy="20">center annotation, marker</tspan>
    <tspan x="758" dy="20">clear, TF/free, battery percent</tspan>
    <tspan x="758" dy="20">and source summary</tspan>
  </text>

  <path class="line-left" d="M344 324 H230"/>
  <text class="calloutTitle" x="82" y="286">Thermal viewport</text>
  <text class="callout" x="82" y="311">
    <tspan x="82" dy="0">80x60 Lepton source</tspan>
    <tspan x="82" dy="20">scaled in portrait view</tspan>
  </text>

  <path class="line" d="M602 410 L650 410 L650 452 H742"/>
  <text class="calloutTitle" x="758" y="452">Palette scale</text>
  <text class="callout" x="758" y="477">
    <tspan x="758" dy="0">auto low/high</tspan>
    <tspan x="758" dy="20">temperature range</tspan>
  </text>

  <path class="line-left" d="M534 580 L260 580"/>
  <text class="calloutTitle" x="82" y="558">Readouts</text>
  <text class="callout" x="82" y="583">
    <tspan x="82" dy="0">center, range,</tspan>
    <tspan x="82" dy="20">active palette</tspan>
  </text>

  <path class="line-left" d="M396 486 H230"/>
  <text class="calloutTitle" x="82" y="470">Spot markers</text>
  <text class="callout" x="82" y="495">
    <tspan x="82" dy="0">toggle-controlled square</tspan>
    <tspan x="82" dy="20">hot/cold markers plus</tspan>
    <tspan x="82" dy="20">up to three custom spots</tspan>
  </text>

  <path class="line-left" d="M362 648 V654 H240"/>
  <text class="calloutTitle" x="82" y="636">Palette icon</text>
  <text class="callout" x="82" y="661">
    <tspan x="82" dy="0">Cycles Ironbow, White,</tspan>
    <tspan x="82" dy="20">Black, Histogram, Lava,</tspan>
    <tspan x="82" dy="20">Hot Iron, Medical, Arctic,</tspan>
    <tspan x="82" dy="20">Rainbow, and Red Hot</tspan>
  </text>

  <path class="line" d="M406 648 V628 H742"/>
  <text class="calloutTitle" x="758" y="610">Image quality icon</text>
  <text class="callout" x="758" y="635">
    <tspan x="758" dy="0">Cycles Detail,</tspan>
    <tspan x="758" dy="20">Balanced, and Smooth</tspan>
    <tspan x="758" dy="20">noise handling</tspan>
  </text>

  <path class="line-left" d="M391 162 H240"/>
  <text class="calloutTitle" x="82" y="144">Status Icons</text>
  <text class="callout" x="82" y="169">
    <tspan x="82" dy="0">QMI8658 gravity vector</tspan>
    <tspan x="82" dy="20">selects orientation;</tspan>
    <tspan x="82" dy="20">FULL/2X, high/low, center</tspan>
  </text>

  <path class="line" d="M435 648 V704 H742"/>
  <text class="calloutTitle" x="758" y="686">CAP button</text>
  <text class="callout" x="758" y="711">
    <tspan x="758" dy="0">saves timestamped BMP</tspan>
    <tspan x="758" dy="20">and optional raw frame</tspan>
  </text>

  <path class="line-left" d="M549 648 V764 H240"/>
  <text class="calloutTitle" x="82" y="746">SETUP button</text>
  <text class="callout" x="82" y="771">
    <tspan x="82" dy="0">opens settings for path,</tspan>
    <tspan x="82" dy="20">idle, rotation, raw save</tspan>
  </text>

  <path class="line-left" d="M511 648 V824 H240"/>
  <text class="calloutTitle" x="82" y="812">Review/Delete</text>
  <text class="callout" x="82" y="837">
    <tspan x="82" dy="0">opens latest capture</tspan>
  </text>

  <path class="line" d="M587 648 V762 H742"/>
  <text class="calloutTitle" x="758" y="744">Power icon</text>
  <text class="callout" x="758" y="769">
    <tspan x="758" dy="0">red PMIC shutdown;</tspan>
    <tspan x="758" dy="20">wake with physical PWR</tspan>
  </text>
</svg>
